name: Release UI Framework

on:
  push:
    tags:
      - 'v*' # Trigger on tags matching v*, i.e. v1.0.0

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to create a release and upload assets
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'web/ui-framework/package-lock.json'

      - name: Install Dependencies
        working-directory: web/ui-framework
        run: npm ci

      - name: Build Framework
        working-directory: web/ui-framework
        run: npm run build

      - name: Pack NPM Package
        id: pack_step
        working-directory: web/ui-framework
        run: |
          PACK_OUTPUT=$(npm pack)
          echo "pack_file=$PACK_OUTPUT" >> $GITHUB_OUTPUT
          echo "Packed file: $PACK_OUTPUT"

      - name: Create Release and Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          files: web/ui-framework/*.tgz
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
